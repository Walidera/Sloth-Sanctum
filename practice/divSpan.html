<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div vs Span</title>
  </head>
  <body>
    <!--Div are block level elements and span are inline elements-->

    <div style="height: 200px; width: 100px">I am a div!!</div>

    <span>I am in a span!!</span>

    <div>I am in another div!</div>
  </body>
</html>
